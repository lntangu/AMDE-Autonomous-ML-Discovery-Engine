[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amde"
version = "4.0.2"
description = "AMDE 4.0: Autonomous Machine Learning Discovery Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AMDE Project" }]
dependencies = [
    "psutil>=5.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
monitoring = ["psutil>=5.9"]
quantum = ["torch>=2.1", "numpy>=1.26"]
tabular = ["scikit-learn>=1.5"]
dev = ["pytest>=7", "psutil>=5.9", "ruff>=0.5", "coverage>=7", "build>=1.0"]

[project.scripts]
amde = "amde.cli:main"
amde2 = "amde.runtime.amde2:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
