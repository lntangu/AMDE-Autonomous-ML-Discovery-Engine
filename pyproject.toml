[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amde"
version = "2.0.3"
description = "Open-ended, reproducible ML method discovery with preregistered research and hybrid quantum simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AMDE project" }]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
# Optional only. The classical core uses the Python standard library.
monitoring = ["psutil>=5.9"]
quantum = ["torch>=2.1", "numpy>=1.26"]
tabular = ["scikit-learn>=1.5"]
dev = ["pytest>=7", "psutil>=5.9", "ruff>=0.5", "coverage>=7"]

[project.scripts]
amde = "amde.cli:main"
amde2 = "amde.runtime.amde2:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
