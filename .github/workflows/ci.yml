name: AMDE CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,tabular,quantum]
      - name: Full qualification (parallel unit + integration)
        run: python scripts/run_full_test_suite.py --integration-timeout 240 --total-timeout 1200

  notebook-smoke:
    name: Notebook Headless Execution Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,tabular,benchmark]
      - name: Execute Colab demonstration notebook headlessly
        run: python scripts/test_execute_notebook.py

  package-smoke:
    name: Clean Wheel Build and Installation Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build package distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and verify in clean virtual environment
        run: |
          python -m venv clean_env
          clean_env/bin/python -m pip install --upgrade pip
          clean_env/bin/python -m pip install dist/amde-4.0.2-py3-none-any.whl
          clean_env/bin/python -c "import amde; print('AMDE version:', amde.__version__); assert amde.__version__ == '4.0.2'"
          clean_env/bin/python -c "from amde import SearchSpace, AMDE4Engine; s = SearchSpace(); e = AMDE4Engine(); print('Clean package smoke test PASSED')"
